# This is a config yaml file for FreeSurfer BIDS App
# BABS project layout (requires a BABS revision containing PennLINC/babs#369)
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

# Input datasets configuration
input_datasets:
    BIDS:
        required_files:
            - "anat/*_T1w.nii*"
        is_zipped: false
        origin_url: "${BIDS_ORIGIN}"
        path_in_babs: sourcedata/BIDS
    NIDM:
        required_files:
            - "nidm.ttl"
        is_zipped: false
        origin_url: "${NIDM_ORIGIN}"
        path_in_babs: sourcedata/NIDM
# Arguments passed to the application inside the container
bids_app_args:
    # MUST stay unquoted. babs_configure_session_selection() locates this line
    # with the pattern '^[[:space:]]*\$SUBJECT_SELECTION_FLAG:' to know where to
    # insert $SESSION_SELECTION_FLAG; a quoted key ("$SUBJECT_SELECTION_FLAG":)
    # does not match, and a session-level FreeSurfer run then aborts with
    # "$SUBJECT_SELECTION_FLAG not found" instead of configuring the flag.
    # The app accepts both --participant_label and --participant-label.
    $SUBJECT_SELECTION_FLAG: "--participant-label"
    # Substituted from the FS_LICENSE variable in .env by
    # babs_prepare_yaml_config. The wrapper fails fast at launch if FS_LICENSE is
    # unset or its file is missing, so a bad value cannot reach the cluster.
    # This must NOT be hardcoded: the license is personal and must not be baked
    # into a shared image or committed here.
    --fs-license-file: "${FS_LICENSE}"
    --skip-bids-validation: ""
    # Note: NIDM will be generated automatically if NIDM/ directory exists
    # ${TMPDIR_HOST} is substituted from the environment by
    # babs_prepare_yaml_config and must match the path bound below: Singularity
    # refuses to use a TMPDIR that is not visible inside the container.
singularity_args:
    - --home
    - ${TMPDIR_HOST}
    - -B
    - ${TMPDIR_HOST}:${TMPDIR_HOST}
    - -B
    - ${TMPDIR_HOST}:/tmp
    #- --userns
    - --no-home
    - --writable-tmpfs
# Output foldername(s) to be zipped. The app writes <output>/sub-<id>/... with
# no app-name wrapper (per-subject layout, ae9518a). ${subid} is NOT substituted
# by babs_prepare_yaml_config (only vars passed to it are); it survives into the
# rendered participant_job.sh where bash defines ${subid} at runtime, so each
# job zips its own subject folder: sub-<id>_sub-<id>-0-1-0.zip.
zip_foldernames:
    ${subid}: "0-1-0"
# How much cluster resources it needs:
cluster_resources:
    interpreting_shell: "/bin/bash"
    # Partition/qos/account are site-specific -- check with
    # `scontrol show partition <name>` before changing them.
    #
    # --no-requeue is MANDATORY, not optional tuning, and must stay on ANY
    # partition that preempts with PreemptMode=REQUEUE. A requeued job keeps
    # its SLURM job id, so participant_job.sh recomputes the SAME
    # BRANCH="job-${SLURM_ARRAY_JOB_ID}-${SLURM_ARRAY_TASK_ID}-${subid}" and
    # then hits its bare `mkdir "${BRANCH}"` (no -p) against the directory the
    # killed attempt left behind -- a guaranteed failure. The script does
    # register `trap cleanup EXIT`, but an untrapped SIGTERM/SIGKILL bypasses
    # an EXIT trap, and GraceTime=0 leaves no window anyway. The freesurfer
    # aug20 run lost sub-0051457 exactly this way.
    #
    # With --no-requeue, SLURM cancels instead of requeueing. Preemption then
    # becomes a clean job failure, and `babs submit` retries it under a NEW
    # array job id -- hence a new BRANCH and no collision. Expect some jobs to
    # need resubmission; that is the trade for the extra nodes.
    #
    # It is harmless on a partition that never preempts, which is why it stays
    # even though this config targets `condo` rather than MIT's
    # mit_preemptable: it costs nothing and removes the need to re-verify
    # PreemptMode after every partition change.
    #
    # mem: 32G. Both aug20 subjects peaked at MaxRSS ~23.99 GB, which is right
    # at the ceiling of a 24G request -- 32G gives real headroom. Do not lower
    # it back to 24G.
    # time: measured 2-3 h for a typical subject, 47 min for the fastest.
    # 03:30:00 was NOT enough -- sub-0051457 hit the wall on a ~2x-slow node.
    # 48:00:00 is far above any measurement and mainly exists to clear the
    # partition's scheduling ceiling; it does not make jobs run longer.
    customized_text: |
        #SBATCH --partition=condo
        #SBATCH --qos=condo
        #SBATCH --account=csd841
        #SBATCH --no-requeue
        #SBATCH --cpus-per-task=8
        #SBATCH --mem=32G
        #SBATCH --time=48:00:00
        #SBATCH --job-name=fs-nidm_bidsapp_${RUN_DATE}
# Necessary commands to be run first:
script_preamble: |
    source ~/.bashrc
    micromamba activate babs
    module load singularitypro/3.11
    # ${TMPDIR_HOST} must be the same path bound in singularity_args above --
    # SINGULARITYENV_* only takes effect inside the container, so pointing it
    # somewhere unbound gives the app a TMPDIR that does not exist in its
    # namespace.
    export SINGULARITYENV_DATALAD_SSH_SOCKETDIR=${TMPDIR_HOST}
    export SINGULARITYENV_TMPDIR=${TMPDIR_HOST}
    # Host-side scratch for singularity itself (SINGULARITYENV_* is in-container only).
    export SINGULARITY_TMPDIR=${TMPDIR_HOST}
# Where to run the jobs:
job_compute_space: "${COMPUTE_SPACE}"
required_files:
    "$INPUT_DATASET_#1":
        - "anat/*_T1w.nii*"
# Alert messages that might be found in log files of failed jobs:
alert_log_messages:
    stdout:
        - "ERROR:"
        - "Cannot allocate memory"
        - "mris_curvature_stats: Could not open file"
        - "Numerical result out of range"
        - "FreeSurfer failed"
        - "recon-all: error"
        - "NIDM conversion failed"
